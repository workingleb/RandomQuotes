<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quotes</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Random Quotes</h1>
      <p id="quote" class="quote-text">
        Click the button to get a random quote
      </p>
      <p id="author" class="quote-author">(Author)</p>
      <button id="generate-btn" class="btn">Generate Quote</button>
      <button id="toogle-favorite-btn" class="btn toogle-favorite-btn" disabled>
        Add to favorites
      </button>
    </div>
    <div id="favorites-container" class="favorites-container">
      <!-- Динамическое добавление цитат через JS -->
    </div>
    <script defer src="index.js" type="module"></script>
  </body>
</html>
